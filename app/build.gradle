apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-android-extensions'
apply plugin: 'com.google.protobuf'


// The signing key, where there is one (local builds, the release workflow). Without it (the test
// workflow, a fresh clone) debug builds use Android's debug key and release builds are unsigned.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasKeystore = keystorePropertiesFile.exists()
if (hasKeystore) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    signingConfigs {
        if (hasKeystore) {
            main {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }
    compileSdkVersion 28
    defaultConfig {
        applicationId "jauler.com.telemetry"
        minSdkVersion 21
        targetSdkVersion 28
        versionCode 38
        versionName "jauler-2.4.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasKeystore) signingConfig signingConfigs.main
        }
        debug {
            applicationIdSuffix ".debug"
            if (hasKeystore) signingConfig signingConfigs.main
        }
    }

	compileOptions {
		sourceCompatibility javaSourceCompatibility
		targetCompatibility javaTargetCompatibility
	}

    lintOptions {
        abortOnError false
    }

    aaptOptions {
        // The terrain pack is compressed internally and is read in place from the APK
        noCompress 'tpk'
    }

    sourceSets {
        main {
            proto {
                srcDir 'src/main/proto'
            }
        }
    }

    // Expose the final (suffixed) application ID to resources, so XML intents
    // such as the one in preferences.xml target the right package per variant.
    applicationVariants.all { variant ->
        variant.resValue "string", "app_package", variant.applicationId
    }
}

protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc:3.21.12'
    }
    generateProtoTasks {
        all().each { task ->
            task.builtins {
                java {
                    option 'lite'
                }
            }
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'androidx.appcompat:appcompat:1.0.2'
    implementation 'com.google.android.material:material:1.0.0'
    implementation 'androidx.preference:preference:1.0.0'
    implementation 'com.jaredrummler:colorpicker:1.1.0'
    implementation 'com.github.mik3y:usb-serial-for-android:3.4.6'
    implementation 'com.nex3z:flow-layout:1.3.0'
    implementation 'com.github.deano2390:MaterialShowcaseView:1.3.4'
    implementation 'org.osmdroid:osmdroid-android:6.1.20'
    implementation 'com.google.protobuf:protobuf-javalite:3.21.12'
    //testImplementation 'deviandroidx.test:core:1.2.0'
    testImplementation 'junit:junit:4.12'
    testImplementation 'org.mockito:mockito-core:1.10.19'
    androidTestImplementation 'androidx.test:core:1.2.0'
    androidTestImplementation 'androidx.test:runner:1.2.0'
    androidTestImplementation 'androidx.test:rules:1.2.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.1'
	implementation 'com.google.android:flexbox:2.0.1'
}

