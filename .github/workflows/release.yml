name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check that the app version matches the tag
        run: |
          # versionName in app/build.gradle is "jauler-X.Y.Z"; the release tag is vX.Y.Z
          tag="${GITHUB_REF_NAME#v}"
          name=$(sed -n 's/^[[:space:]]*versionName "jauler-\(.*\)"[[:space:]]*$/\1/p' app/build.gradle)
          if [ -z "$name" ]; then
            echo "::error file=app/build.gradle::No versionName \"jauler-X.Y.Z\" found in app/build.gradle"
            exit 1
          fi
          if [ "$name" != "$tag" ]; then
            echo "::error file=app/build.gradle::versionName is \"jauler-$name\" but the tag is $GITHUB_REF_NAME: set versionName \"jauler-$tag\" (and raise versionCode) before tagging"
            exit 1
          fi
          echo "versionName jauler-$name matches tag $GITHUB_REF_NAME"

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Decode keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > app/release.keystore

      - name: Write keystore.properties
        run: |
          cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=${{ secrets.RELEASE_STORE_PASSWORD }}
          keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}
          keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew :app:assembleRelease

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
